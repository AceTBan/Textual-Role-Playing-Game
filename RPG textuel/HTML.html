<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>RPG</title>

	<link rel="stylesheet" type="text/css" href="style.css">

</head>

<body>
	<h1>Malik Vs Valentin</h1>
	<h2>Le Bolchevik contre le Gobelin</h2>
	<hr>
<div class="controls">
    <label for="nom1">Combattant 1 :</label>
    <input type="text" id="nom1" value="Malik">
    
    <label for="nom2">Combattant 2 :</label>
    <input type="text" id="nom2" value="Valentin">

	<input id="lancer" type="button" value="Lancer le combat !"/> <br>
	<input id="attaque" type="button" disabled value="Lancer les attaques !" />
	<button id="reset" style="background-color: #e74c3c; color: white;">Réinitialiser</button>
	</div>


	<div id="resume">
		<div id="malik">
			<h3>Malik</h3>
			<div class="health-bar" id="health-malik"></div>
		</div>
		<div id="valentin">
			<h3>Valentin</h3>
			<div class="health-bar" id="health-valentin"></div>
		</div>
	</div>
	
	<script src="Perso.js"></script>
	<script src="app.js"></script>
</body>

</html>
